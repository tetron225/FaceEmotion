<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facial Recognition</title>
    <link rel="stylesheet" type="text/css" href="index.css" />
    <script defer src="face-api.min.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="container">
      <h1 class="header">Mood ID - How Are You Feeling Today?</h1>
      <div id="container2">
        <div id="justtext">I am currently feeling:</div>
        <div id="expression"></div>
      </div>
      <button id="abutton">Click here</button>
      <button id="stop">Stop Viewing</button>
      
      <div id="vidcontainer">
        <video id="avideo" width="640" height="480" autoplay muted></video>
      </div>
      <div id="vidoptioncontainer">
        <div id="option1">
          <button id="quotebutton">Quote Inspiration</button>
          <div id="quoteBox"></div>
        </div>

        <div id="option2">
          <button id="picturemood">Change Your Emotion</button>
          <div id="imagecontainer"></div>
        </div>

        <div id="option3">
          <button id="statbutton">Statistics</button>
          <div id="statcontainer"></div>
        </div>
      
      </div>

      
      
    </div>
      
  </body>
</html>
