<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facial Recognition</title>
    <link rel="stylesheet" type="text/css" href="index.css" />
    <script defer src="face-api.min.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="container">
      <h1 class="header">Mood ID - How Are You Feeling Today?</h1>
      <div id="container2">
        <div id="justtext">I am currently feeling:</div>
        <div id="expression"></div>
      </div>
      <div id='startcontainer'>
        <button id="abutton"><span>Launch Video</span><div class='shine'></div></button>
        <button id="stop"><span>Stop video</span><div class='shine'></div></button>
      </div>
      <div id="container3">
      <div id="vidcontainer">
        <video id="avideo" width="640" height="480" autoplay muted></video>
      </div>
      <div id="vidoptioncontainer">
        <div id="option1" class="containbutton">
          <input type="checkbox" id="quote">
          <label for="quote" class="button" id="quotebutton"></label>
          <div class="text">Quotes</div>
        </div>

        <div id="option2" class="containbutton">
          <input type="checkbox" id="mood">
          <label for="mood" class="button" id="picturemood"></label>
          <div class="text">Image Fun</div>
        </div>

        <div id="option3" class="containbutton">
          <input type="checkbox" id="stats">
          <label for="stats" class="button" id="statbutton"></label>
          <div class="text">Statistics</div>
        </div>

        <div id="option4" class="containbutton">
          <input type="checkbox" id="special">
          <label for="special" class="button" id="specialbutton"></label>
          <div class="text">Special</div>
        </div>
      
      </div>
      </div>
      <div id="resultcontainer">
        <div id="quoteBox"></div>
        <img id="imagecontainer"></img>
        <div id="statcontainer"></div>
      </div>

      
      
    </div>
      
  </body>
</html>
